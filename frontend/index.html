<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Crafty — a magical voxel action-RPG: cast elemental spells, hold the frontier, and face the Shadow Dragon across an infinite world." />
    <title>Crafty | Magical Voxel Adventure</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0C1322" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- SOCIAL PREVIEW. og:image and twitter:image used to point at /favicon.svg, which is blank in every
         scraper for two independent reasons: none of them rasterise SVG, and a root-relative path has no
         host to resolve against when the tag is fetched out of the document. Both are fixed here — a real
         1200x630 PNG at an ABSOLUTE URL. The card is generated from the committed `menu` visual baseline
         by scripts/visual/make-og-image.mjs, so it follows the actual title screen instead of drifting
         from it; regenerate after any title-screen change. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crafty-sand.vercel.app/" />
    <meta property="og:site_name" content="Crafty" />
    <meta property="og:title" content="Crafty | Magical Voxel Adventure" />
    <meta property="og:description" content="Cast elemental spells, hold the frontier, and face the Shadow Dragon across an infinite voxel world." />
    <meta property="og:image" content="https://crafty-sand.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Crafty title screen: a voxel wizard tower under a starfield, with the Crafty wordmark." />

    <!-- summary_large_image, not summary: `summary` renders a small square thumbnail and crops a 1.91:1
         card to nonsense. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crafty | Magical Voxel Adventure" />
    <meta name="twitter:description" content="Cast elemental spells, hold the frontier, and face the Shadow Dragon across an infinite voxel world." />
    <meta name="twitter:image" content="https://crafty-sand.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="The Crafty title screen: a voxel wizard tower under a starfield, with the Crafty wordmark." />
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
</body>

</html>
