<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>height-fog probe</title>
</head>
<body style="margin:0;background:#000">
<script type="module">
// GPU-LEVEL PROOF FOR THE HEIGHT FOG.
//
// The unit gate (tests/gates/height-fog-instancing-gates.test.js) checks the names the patched fog_vertex reads
// against what each stock shader declares before it. That is a declaration check, and it still cannot answer what a
// GPU does with the chunk: whether every fogged material links, and whether each instance and each sprite is fogged
// at its own altitude. This page answers by compiling and rendering. It imports the REAL module -- installHeightFog()
// runs at Atmosphere.jsx module scope, so merely importing it is the same wiring the app uses.
//
// THE CONTROL THAT MAKES THE BOX SCENE A HEIGHT TEST AND NOT A DEPTH TEST. Both instances sit on the camera's
// forward axis at the SAME view-space depth: the camera looks down -Z from (0, MID, 60) at (0, MID, 0),
// so vFogDepth is identical for both boxes no matter their Y. Every difference in the sampled pixel is
// therefore the height term.
//
// Colours are chosen so the sample reads the fog factor directly: white material, black fog. Brighter
// pixel = less fog. MeshBasicMaterial and SpriteMaterial are unlit, so no light rig can drift the reading, and three
// applies fog after the colour-space conversion, so a sample is 255 * (1 - fogFactor).
import * as THREE from 'three';
import { installHeightFog } from '/src/render/Atmosphere.jsx';

// Captured AFTER the module-scope install, so this is what the app actually compiles.
const PATCHED_FOG_VERTEX = THREE.ShaderChunk.fog_vertex;

// The PRE-FIX chunk, reproduced exactly: world Y from modelMatrix alone. For an InstancedMesh whose
// object sits at the origin this yields the LOCAL vertex Y for every instance -- which is the whole
// defect, and why both boxes must come back identical under it. This is the mutation, run on every
// pass rather than once by hand: if the fix regresses, the two variants stop differing and the first
// assertion fails; if the mutation stops reproducing the defect, the second assertion fails.
const PREFIX_FOG_VERTEX = [
  '#ifdef USE_FOG',
  '	vFogDepth = - mvPosition.z;',
  '	vFogWorldY = ( modelMatrix * vec4( transformed, 1.0 ) ).y;',
  '#endif',
].join('\n');

// Two more fixed mutants, each the shape of a real mistake, run on every pass so the probe shows it can see them.
// TRANSFORMED reads `transformed`, which the sprite shader never declares: under it the link sweep must report the
// SpriteMaterial program, and only that one, failing to link. TRANSPOSED multiplies by R where R^T belongs: under it
// the pitched camera of the sprite scene must read the wrong heights.
const TRANSFORMED_FOG_VERTEX = [
  '#ifdef USE_FOG',
  '	vFogDepth = - mvPosition.z;',
  '	#ifdef USE_INSTANCING',
  '		vFogWorldY = ( modelMatrix * instanceMatrix * vec4( transformed, 1.0 ) ).y;',
  '	#else',
  '		vFogWorldY = ( modelMatrix * vec4( transformed, 1.0 ) ).y;',
  '	#endif',
  '#endif',
].join('\n');
const TRANSPOSED_FOG_VERTEX = [
  '#ifdef USE_FOG',
  '	vFogDepth = - mvPosition.z;',
  '	vFogWorldY = ( mat3( viewMatrix ) * ( mvPosition.xyz - viewMatrix[ 3 ].xyz ) ).y;',
  '#endif',
].join('\n');

// Atmosphere.jsx: full fog at/below Y=56, easing to a 0.55 residual by Y=90.
// LOW spans 40..48 (entirely below sea level -> heightT 0 -> full fog).
// HIGH spans 90..98 (entirely past the falloff -> heightT 1 -> residual fog).
const SEA_Y = 56;
const FALLOFF = 34;
const RESIDUAL = 0.55;
const LOW_Y = 44;
const HIGH_Y = 94;
const MID_Y = (LOW_Y + HIGH_Y) / 2;
const BOX = 8;
const CAM_Z = 60;
const FOV = 70;
// 1 - exp(-(0.016^2)(60^2)) = 0.602 base fog: strong enough that the 0.55 residual multiplier is a
// large pixel delta, far from either saturation end where the two boxes would compress together.
const FOG_DENSITY = 0.016;
const W = 256;
const H = 128;
const HALF_EXTENT = Math.tan((FOV * Math.PI) / 360) * CAM_Z; // half the view height at CAM_Z, world units

// The material -> ShaderLib entry three compiles it from (three 0.172 WebGLPrograms.js:22-36), one per stock material
// whose vertex shader includes fog_vertex. The sweep adds an InstancedMesh for the USE_INSTANCING variant.
const FOGGED_MATERIALS = [
  ['MeshBasicMaterial', 'basic'],
  ['MeshLambertMaterial', 'lambert'],
  ['MeshPhongMaterial', 'phong'],
  ['MeshToonMaterial', 'toon'],
  ['MeshStandardMaterial', 'physical'],
  ['MeshPhysicalMaterial', 'physical'],
  ['MeshMatcapMaterial', 'matcap'],
  ['PointsMaterial', 'points'],
  ['LineDashedMaterial', 'dashed'],
  ['ShadowMaterial', 'shadow'],
  ['SpriteMaterial', 'sprite'],
];

// THE SPRITE SCENE. The camera pitches down 35 degrees, so its rotation is not its own transpose: under R in place of
// R^T the heights come out wrong, which a level camera (the box scene's) cannot show. Each sprite is a camera-facing
// quad on the plane CAM_Z in front of the camera, so its whole face shares one view depth, and each sits at a
// different world Y inside the height ramp, where the brightness tracks the altitude.
const SPRITE_PITCH = (-35 * Math.PI) / 180;
const SPRITE_CAM = [0, 100, 40];
const SPRITE_UP_OFFSETS = [-2, 10, 22]; // along the camera's up vector on that plane: world Y about 64, 74 and 84
const SPRITE_SIZE = 6;

function sample(ctx, cx, cy) {
  // Average a 5x5 patch so a single AA-ish pixel on a box edge cannot decide the result.
  const d = ctx.getImageData(cx - 2, cy - 2, 5, 5).data;
  let r = 0;
  for (let i = 0; i < d.length; i += 4) r += d[i];
  return r / (d.length / 4);
}

// The canvas row of a point `up` world units above the view axis at depth CAM_Z.
const rowFor = (up) => Math.round(((1 - up / HALF_EXTENT) / 2) * H);

// What a white fogged sample reads at this world Y and view depth, from Atmosphere.jsx's fog constants above.
function expectedSample(worldY, depth) {
  const base = 1 - Math.exp(-FOG_DENSITY * FOG_DENSITY * depth * depth);
  const heightT = Math.min(1, Math.max(0, (worldY - SEA_Y) / FALLOFF));
  return 255 * (1 - base * (1 + (RESIDUAL - 1) * heightT));
}

function makeRenderer() {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  // preserveDrawingBuffer so the frame survives long enough to be drawn into a 2D context, which
  // flips the row order for us -- gl.readPixels is bottom-left origin and getting that backwards is a
  // silent way to sample the wrong box.
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  return { canvas, renderer };
}

function readBack(canvas) {
  const read = document.createElement('canvas');
  read.width = W;
  read.height = H;
  const ctx = read.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  return ctx;
}

function release(renderer) {
  renderer.dispose();
  renderer.forceContextLoss();
}

function fogScene() {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, FOG_DENSITY);
  return scene;
}

function renderVariant(variant) {
  THREE.ShaderChunk.fog_vertex = variant === 'prefix' ? PREFIX_FOG_VERTEX : PATCHED_FOG_VERTEX;

  const { canvas, renderer } = makeRenderer();
  const scene = fogScene();

  const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
  // WITHOUT THIS THE PROBE WOULD LIE. three keys its program cache on the material PARAMETERS, not on
  // the contents of THREE.ShaderChunk -- so a second material with identical parameters would reuse
  // the program built from the FIRST variant's chunk, and both variants would return the same picture
  // while appearing to test two different shaders. Distinct keys force a real recompile per variant.
  material.customProgramCacheKey = () => 'fogProbe:' + variant;

  const geo = new THREE.BoxGeometry(BOX, BOX, BOX);
  const mesh = new THREE.InstancedMesh(geo, material, 2);
  const m = new THREE.Matrix4();
  mesh.setMatrixAt(0, m.makeTranslation(0, LOW_Y, 0));
  mesh.setMatrixAt(1, m.makeTranslation(0, HIGH_Y, 0));
  mesh.instanceMatrix.needsUpdate = true;
  scene.add(mesh);

  const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 1000);
  camera.position.set(0, MID_Y, CAM_Z);
  camera.lookAt(0, MID_Y, 0);

  renderer.render(scene, camera);
  const ctx = readBack(canvas);

  const out = {
    variant,
    low: sample(ctx, W / 2, rowFor(LOW_Y - MID_Y)),
    high: sample(ctx, W / 2, rowFor(HIGH_Y - MID_Y)),
    background: sample(ctx, 12, 12),
    // three's WebGLPrograms sets its `instancing` parameter from exactly this flag, and that parameter
    // is what emits `#define USE_INSTANCING`. So this is the define's actual source, not a proxy for
    // it -- and if it were somehow false anyway, the patched variant would fall to the #else branch
    // and return two identical samples, which the first assertion rejects.
    isInstanced: mesh.isInstancedMesh === true,
  };

  geo.dispose();
  material.dispose();
  release(renderer);
  return out;
}

// Compiles one object per stock fogged material, plus an InstancedMesh, and asks the context whether each program
// linked. compile() links without a first use, so three never reaches its own console.error for a failed link and
// the shaders are still attached for their sources to be read.
function linkSweep(fogVertex, variant) {
  THREE.ShaderChunk.fog_vertex = fogVertex;
  const { renderer } = makeRenderer();
  const scene = fogScene();
  const geo = new THREE.BoxGeometry(1, 1, 1);
  const materials = [];
  const add = (material, make) => {
    material.fog = true;
    material.customProgramCacheKey = () => 'fogSweep:' + variant;
    materials.push(material);
    scene.add(make(material));
  };
  for (const [type] of FOGGED_MATERIALS) {
    add(new THREE[type](), (mat) => {
      if (mat.isSpriteMaterial) return new THREE.Sprite(mat);
      if (mat.isPointsMaterial) return new THREE.Points(geo, mat);
      if (mat.isLineDashedMaterial) return new THREE.Line(geo, mat);
      return new THREE.Mesh(geo, mat);
    });
  }
  add(new THREE.MeshBasicMaterial(), (mat) => new THREE.InstancedMesh(geo, mat, 1));

  const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 1000);
  camera.position.set(0, 0, 10);
  renderer.compile(scene, camera);

  const gl = renderer.getContext();
  const programs = renderer.info.programs.map((p) => {
    const vertex = gl.getShaderSource(p.vertexShader) || '';
    return {
      type: p.type,
      instanced: vertex.includes('#define USE_INSTANCING'),
      fogged: vertex.includes('#define USE_FOG'),
      linked: gl.getProgramParameter(p.program, gl.LINK_STATUS) === true,
    };
  });

  geo.dispose();
  for (const material of materials) material.dispose();
  release(renderer);
  return { variant, programs };
}

function spriteVariant(fogVertex, variant) {
  THREE.ShaderChunk.fog_vertex = fogVertex;
  const { canvas, renderer } = makeRenderer();
  const scene = fogScene();

  const camera = new THREE.PerspectiveCamera(FOV, W / H, 0.1, 1000);
  camera.position.fromArray(SPRITE_CAM);
  camera.rotation.set(SPRITE_PITCH, 0, 0);
  camera.updateMatrixWorld();
  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

  const material = new THREE.SpriteMaterial({ color: 0xffffff });
  material.customProgramCacheKey = () => 'fogSprite:' + variant;
  const sprites = SPRITE_UP_OFFSETS.map((offset) => {
    const sprite = new THREE.Sprite(material);
    sprite.position.copy(camera.position).addScaledVector(forward, CAM_Z).addScaledVector(up, offset);
    sprite.scale.set(SPRITE_SIZE, SPRITE_SIZE, 1);
    scene.add(sprite);
    return { sprite, offset };
  });

  renderer.render(scene, camera);
  const ctx = readBack(canvas);
  const gl = renderer.getContext();
  const program = renderer.info.programs.find((p) => p.type === 'SpriteMaterial');

  const out = {
    variant,
    linked: program ? gl.getProgramParameter(program.program, gl.LINK_STATUS) === true : null,
    background: sample(ctx, 12, 12),
    sprites: sprites.map(({ sprite, offset }) => {
      const depth = -sprite.position.clone().applyMatrix4(camera.matrixWorldInverse).z;
      return {
        worldY: sprite.position.y,
        depth,
        measured: sample(ctx, W / 2, rowFor(offset)),
        expected: expectedSample(sprite.position.y, depth),
      };
    }),
  };

  material.dispose();
  release(renderer);
  return out;
}

// Every ShaderLib entry whose vertex shader includes fog_vertex but which FOGGED_MATERIALS does not compile. Compared
// by shader text, because two entries can share one (standard and physical do).
function uncoveredFoggedShaders() {
  const covered = new Set(FOGGED_MATERIALS.map(([, id]) => THREE.ShaderLib[id].vertexShader));
  const fogged = Object.entries(THREE.ShaderLib).filter(([, s]) => s.vertexShader.includes('#include <fog_vertex>'));
  return {
    foggedShaders: new Set(fogged.map(([, s]) => s.vertexShader)).size,
    uncovered: fogged.filter(([, s]) => !covered.has(s.vertexShader)).map(([key]) => key),
  };
}

function run(fn) {
  const errors = [];
  let result = null;
  try {
    result = fn();
  } catch (err) {
    errors.push(String((err && err.stack) || err));
  }
  THREE.ShaderChunk.fog_vertex = PATCHED_FOG_VERTEX;
  return { result, errors };
}

window.__fogProbe = () => ({
  ...run(() => ({ patched: renderVariant('patched'), prefix: renderVariant('prefix') })),
  constants: { LOW_Y, HIGH_Y, FOG_DENSITY, RESIDUAL },
});
window.__fogLinkProbe = () => ({
  ...run(() => ({
    shipped: linkSweep(PATCHED_FOG_VERTEX, 'shipped'),
    transformed: linkSweep(TRANSFORMED_FOG_VERTEX, 'transformed'),
    ...uncoveredFoggedShaders(),
  })),
  constants: { types: [...FOGGED_MATERIALS.map(([type]) => type), 'MeshBasicMaterial'] },
});
window.__fogSpriteProbe = () => ({
  ...run(() => ({
    shipped: spriteVariant(PATCHED_FOG_VERTEX, 'shipped'),
    transposed: spriteVariant(TRANSPOSED_FOG_VERTEX, 'transposed'),
  })),
  constants: { SEA_Y, FALLOFF, RESIDUAL, FOG_DENSITY, SPRITE_PITCH },
});
window.__fogProbeReady = true;
</script>
</body>
</html>
