name: CI

# WHY THIS EXISTS (2026-07-13):
# Until today this repo had NO CI and NO git hooks, while Vercel auto-deploys EVERY push to `main`.
# That means a red push shipped straight to the live demo, and nothing mechanically stopped it.
# This workflow is the backstop. It must stay FAST and DETERMINISTIC — a flaky gate that people learn to
# ignore is worse than no gate (see LOOP-CHARTER §3: never weaken a gate to make it pass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend # TWO-LEVEL repo: the app lives in frontend/, docs+memory at the root

jobs:
  # ---------------------------------------------------------------------------
  # Fast deterministic gates. GPU-free, machine-independent. These must never flake.
  # ---------------------------------------------------------------------------
  gates:
    name: unit · lint · knip · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: ESLint (includes the crash-class gate — no-undef / react/jsx-no-undef)
        run: npm run lint

      - name: Unit + static gates (vitest)
        run: npm run test:unit

      - name: Dead-code ratchet (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      # The build artifact is what actually ships to Vercel, so assert on its BYTES, not on the config
      # that was *supposed* to produce them. (The old bundle-split gate merely grepped vite.config.js for
      # `manualChunks` and asserted zero bytes — a vacuous gate. See STATUS §V4.)
      - name: Bundle byte budget
        run: node scripts/ci/bundle-budget.mjs

  # ---------------------------------------------------------------------------
  # E2E. Separate job so a slow browser run can't stall the fast gates.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Doc-currency. Cheap, and it guards the failure mode that actually bit us:
  # a stale doc is a LIVE TRAP that regenerates dead work (LOOP-CHARTER §0-B.6).
  # ---------------------------------------------------------------------------
  docs:
    name: doc currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # this one runs at the repo ROOT
    steps:
      - uses: actions/checkout@v4
      - name: Doc-currency lint
        run: node frontend/scripts/ci/doc-currency.mjs

# NOTE — deliberately NOT in CI (and why):
#   * the 24-state VISUAL gate: it renders the real R3F scene under software WebGL (swiftshader). It is
#     load-sensitive even locally (documented title-mascot timeouts) and would be flaky on a shared runner.
#     Flaky gates get ignored, and an ignored gate is worse than none. It stays a LOCAL pre-merge gate.
#   * perf probes: the median quantizes to the host vblank, so a cloud runner's number is meaningless
#     (see STATUS §F2 — the perf harness's own honesty problem is a tracked item).
