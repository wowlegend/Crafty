name: CI

# WHY THIS EXISTS (2026-07-13):
# Until today this repo had NO CI and NO git hooks, while Vercel auto-deploys EVERY push to `main`.
# That means a red push shipped straight to the live demo, and nothing mechanically stopped it.
# This workflow is the backstop. It must stay FAST and DETERMINISTIC — a flaky gate that people learn to
# ignore is worse than no gate (see LOOP-CHARTER §3: never weaken a gate to make it pass).

# THE REQUIRED CHECK (2026-10-28, DECISIONS 2026-10-28 item 13(b)). main's branch protection requires ONE context:
# the `ci ok` job at the foot of this file, which needs every other job and fails unless each passed (or was skipped
# for a docs-only change, see the `changes` job). Required checks match job NAMES, so the shard count, a job's name
# and the set of jobs can all change freely as long as `ci ok` keeps its name and its needs list stays complete —
# and ci-ok.mjs checks that list against this file on every run.
#
# land/** (2026-10-28): a landing is a local merge commit pushed to `land/<date>` first, so CI certifies the exact sha
# that main will be moved to; the push to main then needs that sha's `ci ok`.
on:
  push:
    branches: [main, 'land/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (OpenSSF hardening): without this the token inherits the repo/org default,
# which may be read-write — a compromised transitive build/test dependency (npm install runs the full tree)
# could then push commits or cut releases with the ambient token. This workflow only reads the checkout; the
# e2e job's upload-artifact uses the Actions runtime token, not GITHUB_TOKEN, so contents:read covers all jobs.
permissions:
  contents: read

# THE GROUP KEY is event + ref: `ci-push-refs/heads/land/2026-10-28`, `ci-push-refs/heads/main`,
# `ci-pull_request-refs/pull/24/merge`, `ci-workflow_dispatch-refs/heads/main`. A run is superseded only by a newer
# run of the SAME event on the SAME ref, so a land/** push is never cancelled by the main push of the same sha (two
# refs, two groups), and a dispatch never cancels the push run it was meant to double-check.
# CANCEL-IN-PROGRESS everywhere EXCEPT main. On a land/**, PR or dispatch ref the older run is for a sha nobody will
# land, so it yields. On main every run is the record of what was deployed — a cancelled run reads as no verdict
# (the 2026-07-27 shape: 86 of 88 runs `cancelled`), and once protection is on main moves only on a sha whose `ci ok`
# already passed — so a main run is never cancelled; a third push while one runs replaces only the PENDING one
# (GitHub's queue of one).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: frontend # TWO-LEVEL repo: the app lives in frontend/, docs+memory at the root

jobs:
  # ---------------------------------------------------------------------------
  # Change scope (2026-10-28). Decides whether this run may skip the browser jobs — the e2e matrix below and the
  # pipeline's prod-smoke step — and outputs `code=true|false`. `false` only when every changed path is docs or
  # Markdown AND the base it is measured against carries a passing `ci ok` of its own, so a skip borrows a verdict
  # that exists rather than one assumed. Every unknown the script meets — a forced push, a base missing from the clone,
  # an empty diff, an API error — makes it write `true`, and everything runs. The rule and its reasons:
  # frontend/scripts/ci/change-scope.mjs.
  # If this JOB fails or is cancelled (a checkout flake, the timeout), no output exists: GitHub skips gates and e2e,
  # because a job whose needs did not succeed is skipped, and `ci ok` FAILS on this job's result. That is a red run
  # with no gate or browser signal, not a run that tested everything.
  # ---------------------------------------------------------------------------
  changes:
    name: change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read # the base commit's `ci ok` check runs are read through the API
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      # Full history: github.event.before, the pull request's base and the merge-base with origin/main must all be
      # in the clone, or the ancestry check fails and the run falls back to everything.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Classify the change (code, or docs only against a certified base)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/change-scope.mjs

  # ---------------------------------------------------------------------------
  # Fast deterministic gates. GPU-free, machine-independent. These must never flake.
  # It runs on EVERY change, docs-only included: doc-currency, opsec-scan, artifact-currency and parts of the unit
  # suite read docs, so a docs change can break this job and nothing else would see it.
  # ---------------------------------------------------------------------------
  gates:
    name: unit · lint · knip · build
    needs: changes
    # PINNED, not ubuntu-latest (2026-10-27): GitHub annotated "The ubuntu-latest label will migrate to Ubuntu 26
    # beginning October 19, 2026", which would move the e2e browsers' OS with no commit here. Move the pin by hand.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # FULL HISTORY (2026-10-28). On a push to main the fast tier runs artifact-currency, whose drift is
      # `rev-list --count syncedSha..HEAD`; a depth-1 clone holds no commit but HEAD, so that count cannot be taken.
      # The drift is a report, never a refusal (DECISIONS 2026-10-28 item 12): in a shallow checkout the line would
      # only say "cannot be measured", which is why the history is fetched. The step runs after the push has landed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      # THE PIPELINE, not a copy of it. These steps used to be listed here AND, differently, in
      # .githooks/pre-push -- two independently-maintained descriptions of "the build". They disagreed,
      # and the drift surfaced on 2026-09-22 as CI mailing about a commit that passed every local gate:
      # a damage-model change broke tests/e2e/soft-death-protections.spec.js, which only this workflow
      # ran. ci/pipeline.sh is the definition; both callers invoke it, so neither can drift.
      #
      # `--tier=fast` adds the steps that need network or a browser (knip, npm audit, prod-smoke) and
      # skips the commit-shaped ones (queue-ledger, e2e-freshness), which need a push refspec a runner does not
      # have. The one exception is artifact-currency: on a push to main it runs here too, to report the pages'
      # drift after a merge GitHub made and to refuse a tree defect such a merge brought in (a pull_request or a
      # workflow_dispatch run skips it).
      #
      # `--code-changed` carries the change-scope verdict: `false` skips prod-smoke (a browser step), anything else runs
      # it. The step also exports CODE_CHANGED so the expression is not spliced into the script text, which means the
      # unit suite this pipeline runs inherits it too, and it executes pipeline.sh under test. That is harmless only
      # because pipeline.sh resets its own CODE_CHANGED before reading flags: the flag decides, never the inherited value.
      - name: Pipeline (fast tier — every deterministic gate, plus network/browser)
        working-directory: .
        env:
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: bash ci/pipeline.sh --tier=fast --code-changed="$CODE_CHANGED"

  # ---------------------------------------------------------------------------
  # E2E. Separate job so a slow browser run can't stall the fast gates.
  # ---------------------------------------------------------------------------
  # SHARDED 2026-07-27. Before this, the job ran all 28 specs on ONE runner with `workers: 1` at
  # ~30s-1.7m each and blew through its own timeout-minutes on EVERY run. A timed-out job reports as
  # `cancelled`, which is visually indistinguishable from a run superseded by `cancel-in-progress`, so
  # the workflow had concluded `success` ZERO times in 88 runs (86 cancelled / 2 failure) and nobody
  # noticed — the fast `gates` and `doc currency` jobs were passing the whole time. Each shard is its
  # own runner with its own vite webServer, so `fullyParallel: false` + `workers: 1` still hold within
  # a shard (shared in-page game state is why they must stay serialized).
  # 3 -> 6 SHARDS 2026-10-27: the masterpiece lanes brought the suite to ~50 tests at 1-3 min each on
  # the software renderer, and every shard of PR #22 hit timeout-minutes with all its finished tests
  # green (#23 and #25 likewise) — the same `cancelled`-reads-as-noise shape as 2026-07-27. Six shards
  # keep the total runner minutes (free: the repo is public) and halve each shard's wall time.
  # 6 -> 8 SHARDS 2026-10-28: with the Phase 0 lanes' specs merged, two shards projected to ~20 min on a first
  # pass with no room for a retry of their heavy specs (PR #24 prep, episode :1209).
  # 25 -> 35 MINUTES 2026-10-28: main run 40642071917 ran shards 5/8 and 7/8 to 23 of 25 min (7/8 with three
  # attempts of one failing case), and a job that hits its cap reports `cancelled`, losing every finished verdict in
  # it. Shards run 5-23 min because specs differ tenfold in cost; the cap is headroom for retries, not a target.
  # DOCS-ONLY SKIP: skipped only when the change-scope job said exactly `false`; an empty or unknown output runs it.
  # A change-scope job that failed or was cancelled has no output at all and skips this job too (its needs did not
  # succeed), which `ci ok` then fails. A skipped e2e is passed by `ci ok` only under that same `false`, so a
  # mis-wired condition cannot turn into a permanent green. The job NAME must keep starting with `e2e`: e2e-freshness.mjs selects these jobs by
  # `^e2e`, and no other job's name may.
  e2e:
    name: e2e (playwright) ${{ matrix.shard }}/8
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false # one red shard must not hide the results of the others
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --grep-invert @local-only excludes the perf probes, which the policy note at the foot of this
      # file has always excluded — perf-siege was sitting in this job in violation of it. The exclusion
      # is HERE, in the workflow, rather than hidden in playwright.config.js, so it is visible to anyone
      # reading what CI actually runs. Those specs still run at full strength locally.
      - name: E2E
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/8 --grep-invert="@local-only"

      # `if: always()` because a shard that FAILED is exactly when you want to know which specs were
      # merely flaky and which actually broke. REPORT-ONLY, exits 0 — `retries: 2` means a retry-then-pass
      # concludes the run `success`, so flakiness is invisible in the only thing anyone reads, and two
      # specs stayed flaky for weeks under that cover. This prints the count every run so the observation
      # window accumulates in the log instead of depending on someone remembering to grep five runs.
      # It also prints its own DENOMINATOR: "walked 0 specs" is a broken report, not a clean one.
      # The `failOnFlakyTests` flip criterion is recorded in docs/superpowers/DECISIONS.md.
      - name: Flaky-spec report
        if: always()
        run: node scripts/ci/flaky-report.mjs

      # RUNTIME REACHABILITY — which src modules the RUNNING GAME executed, from V8 coverage collected
      # inside the browser while Playwright drove a real booted session. This is the only instrument here
      # that can see the dominant defect class: four features on 2026-08-05 that shipped, compiled, gated
      # green and never ran. knip sees the export used, a grep gate sees the line exist, build sees it
      # compile, coverage-zero sees whether a TEST ran it — none sees whether the GAME reaches it.
      # REPORT-ONLY: the unreached list legitimately contains subsystems the 28-spec suite never visits,
      # and failing on that would be failing on E2E breadth in a reachability costume.
      - name: Runtime reachability report
        if: always()
        run: node scripts/ci/runtime-reach.mjs

      # UPLOAD THE ARTEFACTS THAT ACTUALLY EXIST. This uploaded `frontend/playwright-report/` until
      # 2026-08-13 — a directory NOTHING creates, because the CI reporter set is [github, list, json]
      # with no `html` reporter (playwright.config.js). So every red e2e run printed
      # "##[warning]No files were found with the provided path" and attached nothing: run 31728827362
      # has total_count: 0 artefacts. Meanwhile `trace: 'retain-on-failure'` HAD written a trace.zip,
      # a screenshot and an error-context.md for each of the three failed attempts, into
      # frontend/test-results/ — and the job threw them away. One of those traces would have settled
      # in a single look a root cause that instead took three parallel investigations to corner, one
      # of which reached a conclusion the timing data refuted. An upload path is a denominator too.
      # Coverage is excluded: it is per-test JSON that the reachability report already consumed.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }} # per-shard: a fixed name collides across the matrix
          path: |
            frontend/test-results/
            !frontend/test-results/coverage/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Doc-currency. Cheap, and it guards the failure mode that actually bit us:
  # a stale doc is a LIVE TRAP that regenerates dead work (LOOP-CHARTER §0-B.6).
  # ---------------------------------------------------------------------------
  docs:
    name: doc currency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # this one runs at the repo ROOT
    steps:
      - uses: actions/checkout@v7
      - name: Doc-currency lint
        run: node frontend/scripts/ci/doc-currency.mjs

  # ---------------------------------------------------------------------------
  # `ci ok` — THE REQUIRED CHECK (2026-10-28). Branch protection on main requires this job's name and nothing else.
  # It needs EVERY other job (ci-ok.mjs fails the run if ci.yml has a job missing from this list) and passes only
  # when each one succeeded, or, for e2e alone, was skipped because the change-scope job said `false`.
  # `if: always()`, NEVER `!cancelled()`: a skipped job reports SUCCESS to branch protection, so an aggregate that
  # skipped itself on a cancelled run would pass the required check on a sha nothing finished testing. Under
  # always() it runs, reads the cancelled jobs, and fails. Rename this job and main's protection must follow.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci ok
    needs: [changes, gates, e2e, docs]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Two files only: the verdict script and this workflow, which it reads to check its own needs list.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/ci.yml
            frontend/scripts/ci/ci-ok.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Every job passed, or was skipped because nothing it tests changed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/ci-ok.mjs

# NOTE — deliberately NOT in CI (and why):
#   * the 24-state VISUAL gate: it renders the real R3F scene under software WebGL (swiftshader). It is
#     load-sensitive even locally (documented title-mascot timeouts) and would be flaky on a shared runner.
#     Flaky gates get ignored, and an ignored gate is worse than none. It stays a LOCAL pre-merge gate.
#   * perf probes: the median quantizes to the host vblank, so a cloud runner's number is meaningless
#     (see STATUS §F2 — the perf harness's own honesty problem is a tracked item).
#
# RESOLVED 2026-08-02 — the three failures sharding exposed, and how each was closed.
#   Sharding (70e432e) made this workflow CONCLUDE for the first time in 88 runs, which immediately
#   surfaced three failures the job timeout had been hiding. Each was diagnosed by running it on real
#   hardware first, and each got a DIFFERENT fix, because they were three different problems. Not one
#   threshold was lowered and not one test was skipped.
#
#   1. `smoke.spec.js` — NOT an environment artifact; it failed locally too. The shared helpers in
#      tests/e2e/_boot.js declare up to 75s of inner waits inside what was a 60s per-test budget, so it
#      could never pass when terrain streaming ran slow, anywhere. Fixed in `be798fc` by raising the
#      budget to 120s. No assertion touched; ten other specs were one slow world-build from the same bug.
#      2. `world-rebuild-after-load.spec.js` — STILL RED, and the diagnosis has CHANGED. See below.
#   3. `perf-siege.spec.js` — a PERF PROBE, and the policy note above has always excluded perf probes
#      from CI as machine-dependent. It was in the e2e job in violation of that policy. Now tagged
#      `@local-only` and excluded by `--grep-invert` in the E2E step above, where the exclusion is
#      visible. It runs at FULL strength locally and pre-merge; its frame floor is untouched.
#
#   If this workflow goes red again, that is real. Read it.
#
# RESOLVED 2026-08-02 (second correction) — `world-rebuild-after-load` was a TEST defect, not a game bug.
#   Diagnosed in three steps, and the first two were wrong, which is worth keeping:
#     1. "Slow-runner false negative." Replaced the fixed 60s recovery window with one calibrated from the
#        machine's own measured stream throughput — and that calibration falsified the hypothesis it was
#        built on: with 101s/134s/150s budgets the count settled at EXACTLY 30 every time. Not slow.
#     2. "Probably a real save/load bug — partial recovery." Plausible, and wrong. Reading the source
#        showed `load_modifications_done` really does clear the whole requestedChunks set (Terrain.jsx:608).
#     3. Instrumented the recovery TRAJECTORY and let CI answer it. All three attempts climb steadily
#        (2->12->25->30) and flatline at 30 for 60-100s. That is the shape of a streamer FINISHING, not one
#        stalling.
#
#   Root cause: GameScene mounts a drei <PerformanceMonitor> (GameScene.jsx:185) whose onDecline steps the
#   quality tier down, and TIERS.renderDistance is 4/3/2 -> boxes of 81/49/25 chunks, read fresh by the
#   streamer every tick. Re-streaming a world right after a load is the heaviest thing this game does, so on
#   a 2-core runner the monitor declines med->low DURING the measured window. The streamer then correctly
#   refills the 5x5=25 box; 30 is that plus the stragglers `cullDist = renderDistance + 2` deliberately keeps.
#   The test was comparing a med-tier baseline against a low-tier recovery — two different worlds — and
#   calling the difference a defect.
#
#   Fix: the target is now computed from the tier AS IT STANDS AT ASSERTION TIME, not from the pre-load
#   count. The 80% bar is untouched and the real bug is still caught: it parks the count at ZERO, which
#   fails against every tier's box.
