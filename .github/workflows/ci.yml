name: CI

# WHY THIS EXISTS (2026-07-13):
# Until today this repo had NO CI and NO git hooks, while Vercel auto-deploys EVERY push to `main`.
# That means a red push shipped straight to the live demo, and nothing mechanically stopped it.
# This workflow is the backstop. It must stay FAST and DETERMINISTIC — a flaky gate that people learn to
# ignore is worse than no gate (see LOOP-CHARTER §3: never weaken a gate to make it pass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (OpenSSF hardening): without this the token inherits the repo/org default,
# which may be read-write — a compromised transitive build/test dependency (npm install runs the full tree)
# could then push commits or cut releases with the ambient token. This workflow only reads the checkout; the
# e2e job's upload-artifact uses the Actions runtime token, not GITHUB_TOKEN, so contents:read covers all jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend # TWO-LEVEL repo: the app lives in frontend/, docs+memory at the root

jobs:
  # ---------------------------------------------------------------------------
  # Fast deterministic gates. GPU-free, machine-independent. These must never flake.
  # ---------------------------------------------------------------------------
  gates:
    name: unit · lint · knip · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: ESLint (includes the crash-class gate — no-undef / react/jsx-no-undef)
        run: npm run lint

      - name: Unit + static gates (vitest)
        run: npm run test:unit

      - name: Dead-code ratchet (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      # The build artifact is what actually ships to Vercel, so assert on its BYTES, not on the config
      # that was *supposed* to produce them. (The old bundle-split gate merely grepped vite.config.js for
      # `manualChunks` and asserted zero bytes — a vacuous gate. See STATUS §V4.)
      - name: Bundle byte budget
        run: node scripts/ci/bundle-budget.mjs

  # ---------------------------------------------------------------------------
  # E2E. Separate job so a slow browser run can't stall the fast gates.
  # ---------------------------------------------------------------------------
  # SHARDED 2026-07-27. Before this, the job ran all 28 specs on ONE runner with `workers: 1` at
  # ~30s-1.7m each and blew through its own timeout-minutes on EVERY run. A timed-out job reports as
  # `cancelled`, which is visually indistinguishable from a run superseded by `cancel-in-progress`, so
  # the workflow had concluded `success` ZERO times in 88 runs (86 cancelled / 2 failure) and nobody
  # noticed — the fast `gates` and `doc currency` jobs were passing the whole time. Each shard is its
  # own runner with its own vite webServer, so `fullyParallel: false` + `workers: 1` still hold within
  # a shard (shared in-page game state is why they must stay serialized).
  e2e:
    name: e2e (playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one red shard must not hide the results of the other two
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }} # per-shard: a fixed name collides across the matrix
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Doc-currency. Cheap, and it guards the failure mode that actually bit us:
  # a stale doc is a LIVE TRAP that regenerates dead work (LOOP-CHARTER §0-B.6).
  # ---------------------------------------------------------------------------
  docs:
    name: doc currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # this one runs at the repo ROOT
    steps:
      - uses: actions/checkout@v4
      - name: Doc-currency lint
        run: node frontend/scripts/ci/doc-currency.mjs

# NOTE — deliberately NOT in CI (and why):
#   * the 24-state VISUAL gate: it renders the real R3F scene under software WebGL (swiftshader). It is
#     load-sensitive even locally (documented title-mascot timeouts) and would be flaky on a shared runner.
#     Flaky gates get ignored, and an ignored gate is worse than none. It stays a LOCAL pre-merge gate.
#   * perf probes: the median quantizes to the host vblank, so a cloud runner's number is meaningless
#     (see STATUS §F2 — the perf harness's own honesty problem is a tracked item).
#
# ⚠️ KNOWN-RED, DELIBERATELY NOT SILENCED (2026-07-27):
#   `tests/e2e/perf-siege.spec.js` is itself a perf probe and therefore sits inside the class the note
#   above excludes — but it runs in the e2e job, and it has failed on EVERY CI run since 2026-07-13 at
#   `expect(r.frames).toBeGreaterThanOrEqual(5)`. It PASSES on real hardware (verified 2026-07-27: 1.4m,
#   heapGrowth 0, no runtime errors), so this is a false negative from a 2-core shared runner under
#   software WebGL, not a shipped freeze. The floor has NOT been lowered and the test has NOT been
#   skipped — lowering a threshold to make a gate green is the reward-hack LOOP-CHARTER §3 forbids.
#   Instead the assertion now reports its measured numbers, and whether this probe belongs in CI at all
#   is an open decision in KEVIN-REVIEW-BATCH. Expect this job to go visibly RED until that is decided —
#   which is the point: a visible failure beats 88 invisible cancellations.
