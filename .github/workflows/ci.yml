name: CI

# WHY THIS EXISTS (2026-07-13):
# Until today this repo had NO CI and NO git hooks, while Vercel auto-deploys EVERY push to `main`.
# That means a red push shipped straight to the live demo, and nothing mechanically stopped it.
# This workflow is the backstop. It must stay FAST and DETERMINISTIC — a flaky gate that people learn to
# ignore is worse than no gate (see LOOP-CHARTER §3: never weaken a gate to make it pass).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN (OpenSSF hardening): without this the token inherits the repo/org default,
# which may be read-write — a compromised transitive build/test dependency (npm install runs the full tree)
# could then push commits or cut releases with the ambient token. This workflow only reads the checkout; the
# e2e job's upload-artifact uses the Actions runtime token, not GITHUB_TOKEN, so contents:read covers all jobs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend # TWO-LEVEL repo: the app lives in frontend/, docs+memory at the root

jobs:
  # ---------------------------------------------------------------------------
  # Fast deterministic gates. GPU-free, machine-independent. These must never flake.
  # ---------------------------------------------------------------------------
  gates:
    name: unit · lint · knip · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: ESLint (includes the crash-class gate — no-undef / react/jsx-no-undef)
        run: npm run lint

      # 85% of tests/gates/ asserts against source TEXT rather than executing the module, and a whole-file
      # substring match is satisfied by a COMMENT naming the symbol — so the gate stays green when the code
      # it guards is deleted. This runs every toMatch pattern against the target file twice, once with all
      # comment ranges blanked, and fails any assertion that only survives the raw copy.
      - name: Gate shape (no assertion satisfied by a comment)
        run: node scripts/ci/gate-shape.mjs

      - name: Unit + static gates (vitest)
        run: npm run test:unit

      - name: Dead-code ratchet (knip)
        run: npm run knip

      - name: Build
        run: npm run build

      # The build artifact is what actually ships to Vercel, so assert on its BYTES, not on the config
      # that was *supposed* to produce them. (The old bundle-split gate merely grepped vite.config.js for
      # `manualChunks` and asserted zero bytes — a vacuous gate. See STATUS §V4.)
      - name: Bundle byte budget
        run: node scripts/ci/bundle-budget.mjs

  # ---------------------------------------------------------------------------
  # E2E. Separate job so a slow browser run can't stall the fast gates.
  # ---------------------------------------------------------------------------
  # SHARDED 2026-07-27. Before this, the job ran all 28 specs on ONE runner with `workers: 1` at
  # ~30s-1.7m each and blew through its own timeout-minutes on EVERY run. A timed-out job reports as
  # `cancelled`, which is visually indistinguishable from a run superseded by `cancel-in-progress`, so
  # the workflow had concluded `success` ZERO times in 88 runs (86 cancelled / 2 failure) and nobody
  # noticed — the fast `gates` and `doc currency` jobs were passing the whole time. Each shard is its
  # own runner with its own vite webServer, so `fullyParallel: false` + `workers: 1` still hold within
  # a shard (shared in-page game state is why they must stay serialized).
  e2e:
    name: e2e (playwright) ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one red shard must not hide the results of the other two
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is the ideal (strictly reproducible), but it is structurally IMPOSSIBLE here today:
      # the lockfile is generated on macOS/arm64, and the oxc/lightningcss toolchain pulls linux-only
      # optional napi binaries (@emnapi/core@1.11.2, @emnapi/runtime@1.11.2) that a macOS resolve never
      # records. `npm ci` correctly refuses; `npm install` resolves them per-platform while still honoring
      # the lock for everything else. Revisit if the lockfile is ever generated on linux (or in a container).
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --grep-invert @local-only excludes the perf probes, which the policy note at the foot of this
      # file has always excluded — perf-siege was sitting in this job in violation of it. The exclusion
      # is HERE, in the workflow, rather than hidden in playwright.config.js, so it is visible to anyone
      # reading what CI actually runs. Those specs still run at full strength locally.
      - name: E2E
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --grep-invert="@local-only"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-shard-${{ matrix.shard }} # per-shard: a fixed name collides across the matrix
          path: frontend/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Doc-currency. Cheap, and it guards the failure mode that actually bit us:
  # a stale doc is a LIVE TRAP that regenerates dead work (LOOP-CHARTER §0-B.6).
  # ---------------------------------------------------------------------------
  docs:
    name: doc currency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: . # this one runs at the repo ROOT
    steps:
      - uses: actions/checkout@v4
      - name: Doc-currency lint
        run: node frontend/scripts/ci/doc-currency.mjs

# NOTE — deliberately NOT in CI (and why):
#   * the 24-state VISUAL gate: it renders the real R3F scene under software WebGL (swiftshader). It is
#     load-sensitive even locally (documented title-mascot timeouts) and would be flaky on a shared runner.
#     Flaky gates get ignored, and an ignored gate is worse than none. It stays a LOCAL pre-merge gate.
#   * perf probes: the median quantizes to the host vblank, so a cloud runner's number is meaningless
#     (see STATUS §F2 — the perf harness's own honesty problem is a tracked item).
#
# RESOLVED 2026-08-02 — the three failures sharding exposed, and how each was closed.
#   Sharding (70e432e) made this workflow CONCLUDE for the first time in 88 runs, which immediately
#   surfaced three failures the job timeout had been hiding. Each was diagnosed by running it on real
#   hardware first, and each got a DIFFERENT fix, because they were three different problems. Not one
#   threshold was lowered and not one test was skipped.
#
#   1. `smoke.spec.js` — NOT an environment artifact; it failed locally too. The shared helpers in
#      tests/e2e/_boot.js declare up to 75s of inner waits inside what was a 60s per-test budget, so it
#      could never pass when terrain streaming ran slow, anywhere. Fixed in `be798fc` by raising the
#      budget to 120s. No assertion touched; ten other specs were one slow world-build from the same bug.
#      2. `world-rebuild-after-load.spec.js` — STILL RED, and the diagnosis has CHANGED. See below.
#   3. `perf-siege.spec.js` — a PERF PROBE, and the policy note above has always excluded perf probes
#      from CI as machine-dependent. It was in the e2e job in violation of that policy. Now tagged
#      `@local-only` and excluded by `--grep-invert` in the E2E step above, where the exclusion is
#      visible. It runs at FULL strength locally and pre-merge; its frame floor is untouched.
#
#   If this workflow goes red again, that is real. Read it.
#
# RESOLVED 2026-08-02 (second correction) — `world-rebuild-after-load` was a TEST defect, not a game bug.
#   Diagnosed in three steps, and the first two were wrong, which is worth keeping:
#     1. "Slow-runner false negative." Replaced the fixed 60s recovery window with one calibrated from the
#        machine's own measured stream throughput — and that calibration falsified the hypothesis it was
#        built on: with 101s/134s/150s budgets the count settled at EXACTLY 30 every time. Not slow.
#     2. "Probably a real save/load bug — partial recovery." Plausible, and wrong. Reading the source
#        showed `load_modifications_done` really does clear the whole requestedChunks set (Terrain.jsx:608).
#     3. Instrumented the recovery TRAJECTORY and let CI answer it. All three attempts climb steadily
#        (2->12->25->30) and flatline at 30 for 60-100s. That is the shape of a streamer FINISHING, not one
#        stalling.
#
#   Root cause: GameScene mounts a drei <PerformanceMonitor> (GameScene.jsx:185) whose onDecline steps the
#   quality tier down, and TIERS.renderDistance is 4/3/2 -> boxes of 81/49/25 chunks, read fresh by the
#   streamer every tick. Re-streaming a world right after a load is the heaviest thing this game does, so on
#   a 2-core runner the monitor declines med->low DURING the measured window. The streamer then correctly
#   refills the 5x5=25 box; 30 is that plus the stragglers `cullDist = renderDistance + 2` deliberately keeps.
#   The test was comparing a med-tier baseline against a low-tier recovery — two different worlds — and
#   calling the difference a defect.
#
#   Fix: the target is now computed from the tier AS IT STANDS AT ASSERTION TIME, not from the pre-load
#   count. The 80% bar is untouched and the real bug is still caught: it parks the count at ZERO, which
#   fails against every tier's box.
