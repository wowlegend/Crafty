# Dependency updates. There was no scanning of any kind before 2026-08-12: `npm install --no-audit`, no
# audit step, no Dependabot — so a CVE in a transitive dep shipped to the live demo on the next push and
# nothing was looking. The CI job now FAILS on a high/critical advisory; this is the other half, the part
# that opens the fix.
#
# TWO-LEVEL REPO: the app manifest is in `frontend/`, not at the root. A `directory: "/"` entry here would
# find no package.json and silently do nothing — a config that looks like coverage and provides none.
#
# Deliberately conservative on cadence. A weekly firehose of patch bumps across three ecosystems is how
# Dependabot gets muted, and a muted bot is worse than none for the same reason a flaky gate is: the
# signal that matters arrives in a stream nobody reads. Security updates are ungrouped and immediate;
# routine version bumps are monthly and grouped into one PR per ecosystem.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, so review is a single diff rather than a queue of near-identical
      # ones. Security advisories bypass grouping and arrive on their own, which is the point.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # NO MAJORS, FROM ANY PACKAGE. Corrected 2026-08-12, an hour after the first version of this file
    # landed, because that version was wrong in a way its own comment claimed to be guarding against.
    #
    # WHAT HAPPENED. The groups above only cover [minor, patch], so every MAJOR escaped grouping and got
    # its own PR. Dependabot's first scan runs the moment the config lands, not on the monthly schedule,
    # so eight PRs opened within four minutes — the exact firehose the header says it is avoiding — and
    # Vercel built a preview for each. One failed and emailed the owner at 00:21 his time.
    #
    # The blocked one is instructive rather than embarrassing: eslint 9 -> 10 cannot resolve at all,
    # because eslint-plugin-react's LATEST release (7.37.5, the version already pinned here) still peers
    # on `eslint@^3 || ... || ^9.7`. There is no plugin release that supports eslint 10 yet. Verified
    # against the registry, not assumed. So it was never mergeable, and a bot could not have known that
    # before opening it — which is the general case, not a special one.
    #
    # THE PRINCIPLE THE OLD LIST HAD RIGHT BUT SCOPED TOO NARROWLY: a major is deliberate work. It is a
    # changelog to read and a peer graph to check, and this repo's owner reviews asynchronously — so an
    # unrequested major PR costs attention at a moment nobody chose. The old list named three packages;
    # the reasoning applied to all of them. Majors stay discoverable via `npm outdated`, and SECURITY
    # updates bypass this block entirely, which is the whole point of the audit gate in ci.yml.
    #
    # To re-enable majors for a package, delete its wildcard from this list. It is one line, on purpose.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # AND MINOR, FOR THE 0.x ENGINE STACK. Corrected again 2026-08-12, after the majors-ignore rule
      # produced a grouped PR containing `three 0.172.0 -> 0.185.1` — THIRTEEN releases of the renderer —
      # alongside @react-three/fiber and drei, and it passed every CI check.
      #
      # It passed because CI structurally cannot see rendering: the visual gate is in neither the pre-push
      # hook nor the workflow (733-925s per run, and every baseline is macOS/arm64 against Ubuntu runners).
      # A green tick on a renderer bump is a statement about unit tests and bundle size, not about pixels.
      #
      # Under semver, 0.x MINOR is the breaking position — 0.172 -> 0.185 is thirteen breaking releases
      # wearing a "minor" label, and `version-update:semver-major` matches none of them. The original
      # config's own comment already said these libraries move together and a mismatched trio breaks
      # rendering in ways the unit suite cannot see; the RULE just never expressed it. Physics (rapier)
      # and the icon set (lucide-react, 0.439 -> 0.577) are the same shape.
      #
      # These are deliberate work: bump, run `npm run test:visual`, LOOK at the frames, and re-baseline
      # with a Baseline-Review trailer if the render legitimately moved.
      - dependency-name: three
        update-types: [version-update:semver-minor]
      - dependency-name: '@react-three/*'
        update-types: [version-update:semver-minor]
      # rapier3d-compat is held at PATCH as well, and for a DIFFERENT reason from the render trio above.
      # @react-three/rapier pins it EXACTLY (2.2.0 -> "0.19.2", no range), and our direct entry exists
      # only because it was a phantom dep (32625c0: imported by an integration test and a bench, declared
      # nowhere). While the two agree they dedupe to one copy and the integration test genuinely drives
      # "the same build the app ships", which is its whole reason for existing.
      #
      # The 0.19.2 -> 0.19.3 patch bump of 2026-08-13 broke that. It arrived in a group labelled
      # "dev-dependencies", nothing failed, the bundle did not move, and the app kept running 0.19.2 from
      # a NEWLY NESTED copy — the only casualty was the test quietly starting to exercise a different
      # engine than the one it names. So this package cannot move on its own at ANY level: it moves when
      # @react-three/rapier moves, together, or not at all. `supply-chain.test.js` fails if they diverge.
      - dependency-name: '@dimforge/rapier3d-compat'
        update-types: [version-update:semver-minor, version-update:semver-patch]
      - dependency-name: postprocessing
        update-types: [version-update:semver-minor]
      # @react-three/postprocessing is held at PATCH too, which the minor rule alone did not cover.
      # Measured 2026-08-13: 3.0.5 declares peer `three >= 0.182.0`, and three is pinned at 0.172.0 by
      # the rule above — so `npm install` refuses with ERESOLVE and the PR fails every check. A patch of
      # this package silently demands a thirteen-minor jump of the renderer. Without this line Dependabot
      # regenerates that unmergeable PR every month, each one a failed build and an email.
      - dependency-name: '@react-three/postprocessing'
        update-types: [version-update:semver-patch]
      - dependency-name: lucide-react
        update-types: [version-update:semver-minor]

  # The workflow files themselves pin action versions, and a stale pinned action is its own supply-chain
  # exposure — actions/checkout@v4 running arbitrary code on a runner that has the GITHUB_TOKEN.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Same rule, same reason. actions/checkout v4 -> v7 is three majors of behaviour change to read; it
    # arrived as its own PR on the first scan alongside two siblings. Security advisories still come
    # through, which is what actually matters for an action running on a token-bearing runner.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
